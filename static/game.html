<div class="sq-root" data-state="booting">
  <div class="sq-hud">
    <div class="sq-title">semantique</div>
    <div class="sq-targets"><span class="sq-targets-label">targets: </span><span class="sq-target-list"></span></div>
    <div class="sq-context" aria-label="hops">
      <span class="sq-context-label">hops:</span>
      <span class="sq-context-count"><b class="sq-ctx-used">0</b>/<b class="sq-ctx-cap"></b></span>
    </div>
  </div>
  <div class="sq-prompt">
    <span class="sq-prompt-label">sentence:</span>
    <span class="sq-chips"></span>
  </div>
  <div class="sq-stage"></div>
  <div class="sq-hint">arrow keys / WASD to hop</div>
  <button class="sq-nav sq-nav-back sq-hidden" type="button" aria-label="back a board">
    <span class="sq-nav-arrow"></span>
    <span class="sq-nav-label"></span>
  </button>
  <button class="sq-nav sq-nav-next sq-hidden" type="button" aria-label="on to the next board">
    <span class="sq-nav-label"></span>
    <span class="sq-nav-arrow"></span>
  </button>
  <div class="sq-overlay sq-hidden">
    <div class="sq-card">
      <div class="sq-card-sentence"></div>
      <div class="sq-bars"></div>
      <div class="sq-stamp"></div>
      <div class="sq-card-actions">
        <button class="sq-retry sq-hidden" type="button">poke the judge again</button>
        <button class="sq-again sq-hidden" type="button">hop again</button>
      </div>
    </div>
  </div>
</div>
